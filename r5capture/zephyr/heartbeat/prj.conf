# No console: UART1 is on header pins 8/10 and may belong to Linux
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_MAIN_STACK_SIZE=1024

# The tick timer runs from the 25 MHz oscillator (measured against Linux), not
# the SoC default of 19.2 MHz
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=25000000
