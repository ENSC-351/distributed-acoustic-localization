CONFIG_KERNEL_BIN_NAME="r5capture"
CONFIG_PRINTK=n
CONFIG_IPM=y
CONFIG_MAIN_STACK_SIZE=1024
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_MASTER=n

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RPMSG=y

# r5capture: do NOT enable CONFIG_CACHE_MANAGEMENT. On this SoC it makes the boot
# code turn the R5 data cache on, but only DRAM gets an MPU region, so device
# registers (timer, mailbox) can be read from stale cache: the firmware stalls
# (heartbeat stuck at 0, no RPMsg channels). Verified on the board 2026-11-25.

# Debugging over the RPMsg shell: "kernel thread list" shows every thread and its state
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y
